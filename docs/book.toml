[book]
authors = ["rsteube"]
language = "en"
src = "src"
title = "carapace-spec"
description = "A multi-shell completion spec."

[output.html]
default-theme = "Latte"
preferred-dark-theme = "Mocha"
additional-css = ["./theme/catppuccin.css"]
git-repository-url = "https://github.com/carapace-sh/carapace-spec"
edit-url-template = "https://github.com/carapace-sh/carapace-spec/edit/master/docs/{path}"

[output.html.fold]
enable = true

[output.linkcheck2]

[preprocessor.asciinema]
[preprocessor.catppuccin]
